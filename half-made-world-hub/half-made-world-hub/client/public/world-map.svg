<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  
  <!-- Grid lines -->
  <g opacity="0.06" stroke="#60a5fa" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="900"/>
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="700" y1="0" x2="700" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
    <line x1="1100" y1="0" x2="1100" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="0" y1="800" x2="1200" y2="800"/>
    <line x1="0" y1="900" x2="1200" y2="900"/>
  </g>

  <!-- ===== TITLE ===== -->
  <text x="600" y="42" text-anchor="middle" fill="#e8f1ff" font-size="22" font-weight="700" letter-spacing="4" text-transform="uppercase" font-family="'Rajdhani', system-ui">THE HALF-MADE WORLD</text>
  <text x="600" y="62" text-anchor="middle" fill="#64748f" font-size="11" letter-spacing="2">REALM MAP · YEAR ~2350 VC</text>

  <!-- ===== WORLD BARRIER (outer ring) ===== -->
  <ellipse cx="600" cy="480" rx="540" ry="380" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="8 4" opacity="0.2"/>
  <text x="600" y="870" text-anchor="middle" fill="#60a5fa" font-size="9" opacity="0.4" letter-spacing="3">WORLD BARRIER</text>

  <!-- ===== HUMAN REALM (center-left, largest) ===== -->
  <g filter="url(#glow)">
    <ellipse cx="420" cy="460" rx="260" ry="200" fill="rgba(34,211,238,0.04)" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
  </g>
  <text x="420" y="310" text-anchor="middle" fill="#22d3ee" font-size="16" font-weight="700" letter-spacing="3" filter="url(#glow)">HUMAN REALM</text>
  <text x="420" y="328" text-anchor="middle" fill="#22d3ee" font-size="9" opacity="0.6">Population: ~500,000+</text>
  
  <!-- Aldermere (Capital) -->
  <circle cx="420" cy="420" r="12" fill="#22d3ee" opacity="0.3" filter="url(#glow-strong)"/>
  <circle cx="420" cy="420" r="6" fill="#22d3ee"/>
  <text x="420" y="400" text-anchor="middle" fill="#e8f1ff" font-size="11" font-weight="600">★ ALDERMERE</text>
  <text x="420" y="448" text-anchor="middle" fill="#9fb0cc" font-size="8">Capital · Ruby Divina</text>

  <!-- Elyndor Academy (neutral, between realms) -->
  <circle cx="540" cy="390" r="8" fill="#fbbf24" opacity="0.4" filter="url(#glow-strong)"/>
  <circle cx="540" cy="390" r="4" fill="#fbbf24"/>
  <text x="540" y="375" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">ELYNDOR ACADEMY</text>
  <text x="540" y="406" text-anchor="middle" fill="#9fb0cc" font-size="7">Neutral · Head Master Kael</text>

  <!-- Common Sundering Altar -->
  <circle cx="510" cy="450" r="5" fill="#a78bfa" opacity="0.5"/>
  <text x="510" y="468" text-anchor="middle" fill="#a78bfa" font-size="7">Common Altar</text>

  <!-- Arubian Forest -->
  <g opacity="0.5">
    <text x="320" y="480" text-anchor="middle" fill="#34d399" font-size="9" font-weight="500">🌲 Arubian Forest</text>
    <text x="320" y="492" text-anchor="middle" fill="#34d399" font-size="7" opacity="0.7">Light half · Pallantine Elves</text>
  </g>

  <!-- Shattered Lands (border with Demon Realm) -->
  <g opacity="0.5">
    <rect x="530" y="500" width="80" height="30" rx="4" fill="rgba(248,113,113,0.15)" stroke="#f87171" stroke-width="0.5" stroke-dasharray="3 2"/>
    <text x="570" y="514" text-anchor="middle" fill="#f87171" font-size="8" font-weight="600">SHATTERED LANDS</text>
    <text x="570" y="524" text-anchor="middle" fill="#f87171" font-size="6" opacity="0.7">300-mile wasteland</text>
  </g>

  <!-- Human cities -->
  <circle cx="340" cy="380" r="3" fill="#22d3ee" opacity="0.4"/>
  <text x="340" y="372" text-anchor="middle" fill="#9fb0cc" font-size="7">Vorath</text>
  
  <circle cx="370" cy="520" r="3" fill="#22d3ee" opacity="0.4"/>
  <text x="370" y="536" text-anchor="middle" fill="#9fb0cc" font-size="7">Aurelion</text>

  <!-- ===== ANGEL REALM (top-right) ===== -->
  <g filter="url(#glow)">
    <ellipse cx="850" cy="280" rx="220" ry="170" fill="rgba(251,191,36,0.03)" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
  </g>
  <text x="850" y="155" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="700" letter-spacing="3" filter="url(#glow)">ANGEL REALM</text>
  <text x="850" y="173" text-anchor="middle" fill="#fbbf24" font-size="9" opacity="0.6">Population: ~30,000</text>

  <!-- Aurelion (Capital) -->
  <circle cx="850" cy="260" r="12" fill="#fbbf24" opacity="0.3" filter="url(#glow-strong)"/>
  <circle cx="850" cy="260" r="6" fill="#fbbf24"/>
  <text x="850" y="240" text-anchor="middle" fill="#e8f1ff" font-size="11" font-weight="600">★ AURELION</text>
  <text x="850" y="288" text-anchor="middle" fill="#9fb0cc" font-size="8">Capital · Clint Ashborn</text>

  <!-- Crystal Oceans -->
  <g opacity="0.4">
    <text x="920" y="200" text-anchor="middle" fill="#fbbf24" font-size="8">💎 Crystal Oceans</text>
  </g>

  <!-- Crystal Forests -->
  <g opacity="0.4">
    <text x="780" y="320" text-anchor="middle" fill="#fbbf24" font-size="8">💎 Crystal Forests</text>
  </g>

  <!-- Cathedral of the First Vow -->
  <circle cx="800" cy="220" r="4" fill="#fbbf24" opacity="0.5"/>
  <text x="800" y="210" text-anchor="middle" fill="#fbbf24" font-size="7">Cathedral</text>

  <!-- ===== DEMON REALM (bottom-right) ===== -->
  <g filter="url(#glow)">
    <ellipse cx="850" cy="640" rx="220" ry="170" fill="rgba(139,92,246,0.04)" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5"/>
  </g>
  <text x="850" y="515" text-anchor="middle" fill="#8b5cf6" font-size="16" font-weight="700" letter-spacing="3" filter="url(#glow)">DEMON REALM</text>
  <text x="850" y="533" text-anchor="middle" fill="#8b5cf6" font-size="9" opacity="0.6">Population: ~500,000+</text>

  <!-- Vorath (Capital) -->
  <circle cx="850" cy="660" r="12" fill="#8b5cf6" opacity="0.3" filter="url(#glow-strong)"/>
  <circle cx="850" cy="660" r="6" fill="#8b5cf6"/>
  <text x="850" y="640" text-anchor="middle" fill="#e8f1ff" font-size="11" font-weight="600">★ VORATH</text>
  <text x="850" y="688" text-anchor="middle" fill="#9fb0cc" font-size="8">Capital · Tera Morage</text>

  <!-- Obsidian Spires -->
  <g opacity="0.5">
    <text x="920" y="600" text-anchor="middle" fill="#8b5cf6" font-size="8">🔥 Obsidian Spires</text>
  </g>

  <!-- Umbrage Forest -->
  <g opacity="0.5">
    <text x="770" y="720" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="500">🌲 Umbrage Forest</text>
    <text x="770" y="732" text-anchor="middle" fill="#a78bfa" font-size="7" opacity="0.7">Dark half · Veilborn Elves</text>
  </g>

  <!-- The Wound -->
  <g opacity="0.4">
    <rect x="680" y="580" width="60" height="20" rx="3" fill="rgba(248,113,113,0.2)" stroke="#f87171" stroke-width="0.5"/>
    <text x="710" y="594" text-anchor="middle" fill="#f87171" font-size="7">The Wound</text>
  </g>

  <!-- Ether Forest (border between Human and Demon) -->
  <g opacity="0.5">
    <text x="630" y="570" text-anchor="middle" fill="#34d399" font-size="8" font-weight="500">🌲 Ether Forest</text>
    <text x="630" y="580" text-anchor="middle" fill="#34d399" font-size="6" opacity="0.7">Light + Dark halves</text>
  </g>

  <!-- Demon Pit -->
  <circle cx="890" cy="700" r="3" fill="#8b5cf6" opacity="0.5"/>
  <text x="890" y="712" text-anchor="middle" fill="#9fb0cc" font-size="7">The Pit</text>

  <!-- ===== HIDDEN REALM (center, between all) ===== -->
  <g filter="url(#glow)">
    <ellipse cx="600" cy="480" rx="100" ry="70" fill="rgba(139,92,246,0.06)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="5 3" opacity="0.4"/>
  </g>
  <text x="600" y="460" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700" letter-spacing="2">HIDDEN REALM</text>
  <text x="600" y="475" text-anchor="middle" fill="#a78bfa" font-size="8" opacity="0.7">Time: 10x slower</text>
  <text x="600" y="488" text-anchor="middle" fill="#a78bfa" font-size="8" opacity="0.7">Portal moves every leap year</text>

  <!-- Lethmoor Kingdom -->
  <circle cx="580" cy="500" r="4" fill="#f87171" opacity="0.5"/>
  <text x="580" y="514" text-anchor="middle" fill="#f87171" font-size="7">Lethmoor</text>

  <!-- Thornlost Forest -->
  <text x="620" y="505" text-anchor="middle" fill="#34d399" font-size="6" opacity="0.6">Thornlost</text>

  <!-- Sentient River -->
  <text x="610" y="520" text-anchor="middle" fill="#60a5fa" font-size="6" opacity="0.6">Sentient River</text>

  <!-- ===== REALM GATES (connections) ===== -->
  
  <!-- Gate: Human ↔ Angel -->
  <line x1="560" y1="370" x2="700" y2="300" stroke="#22d3ee" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 3"/>
  <rect x="618" y="325" width="50" height="16" rx="3" fill="rgba(10,16,32,0.9)" stroke="#22d3ee" stroke-width="0.5"/>
  <text x="643" y="336" text-anchor="middle" fill="#22d3ee" font-size="7" font-weight="600">REALM GATE</text>
  <text x="643" y="355" text-anchor="middle" fill="#64748f" font-size="6">Guarded by Shudon</text>

  <!-- Gate: Human ↔ Demon -->
  <line x1="560" y1="540" x2="700" y2="620" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 3"/>
  <rect x="618" y="570" width="50" height="16" rx="3" fill="rgba(10,16,32,0.9)" stroke="#8b5cf6" stroke-width="0.5"/>
  <text x="643" y="581" text-anchor="middle" fill="#8b5cf6" font-size="7" font-weight="600">REALM GATE</text>
  <text x="643" y="600" text-anchor="middle" fill="#64748f" font-size="6">Guarded by Shudon</text>

  <!-- Sunward Road (Human ↔ Angel) -->
  <line x1="460" y1="380" x2="720" y2="290" stroke="#22d3ee" stroke-width="0.5" opacity="0.3" stroke-dasharray="2 2"/>
  <text x="580" y="320" text-anchor="middle" fill="#22d3ee" font-size="6" opacity="0.5" transform="rotate(-15 580 320)">Sunward Road</text>

  <!-- Thorn Road (Human ↔ Demon) -->
  <line x1="460" y1="530" x2="720" y2="640" stroke="#8b5cf6" stroke-width="0.5" opacity="0.3" stroke-dasharray="2 2"/>
  <text x="580" y="600" text-anchor="middle" fill="#8b5cf6" font-size="6" opacity="0.5" transform="rotate(15 580 600)">Thorn Road</text>

  <!-- Wandering Portal indicator -->
  <circle cx="700" cy="680" r="6" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2 2" opacity="0.6">
    <animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="700" y="700" text-anchor="middle" fill="#fbbf24" font-size="7" font-weight="600">WANDERING PORTAL</text>
  <text x="700" y="710" text-anchor="middle" fill="#fbbf24" font-size="6" opacity="0.6">Currently in Umbrage Forest</text>

  <!-- ===== KEY (legend) ===== -->
  <g transform="translate(30, 750)">
    <rect x="0" y="0" width="320" height="110" rx="8" fill="rgba(10,16,32,0.9)" stroke="#60a5fa" stroke-width="0.5" opacity="0.8"/>
    <text x="15" y="20" fill="#e8f1ff" font-size="10" font-weight="700" letter-spacing="2">LEGEND</text>
    
    <circle cx="25" cy="38" r="5" fill="#22d3ee"/>
    <text x="38" y="42" fill="#9fb0cc" font-size="8">Realm Capital</text>
    
    <circle cx="25" cy="55" r="4" fill="#fbbf24"/>
    <text x="38" y="59" fill="#9fb0cc" font-size="8">Elyndor Academy (Neutral)</text>
    
    <circle cx="25" cy="72" r="4" fill="#a78bfa"/>
    <text x="38" y="76" fill="#9fb0cc" font-size="8">Common Sundering Altar</text>
    
    <line x1="18" y1="88" x2="32" y2="88" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="38" y="92" fill="#9fb0cc" font-size="8">Realm Gate / Road</text>

    <rect x="170" y="30" width="130" height="70" rx="4" fill="none" stroke="#f87171" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.5"/>
    <text x="235" y="50" text-anchor="middle" fill="#f87171" font-size="8">DANGER ZONES</text>
    <text x="235" y="65" text-anchor="middle" fill="#f87171" font-size="7">Shattered Lands</text>
    <text x="235" y="78" text-anchor="middle" fill="#f87171" font-size="7">The Wound</text>
    <text x="235" y="91" text-anchor="middle" fill="#f87171" font-size="7">Corrupted Veyn zones</text>
  </g>

  <!-- ===== NOTES ===== -->
  <g transform="translate(380, 750)">
    <rect x="0" y="0" width="460" height="110" rx="8" fill="rgba(10,16,32,0.9)" stroke="#60a5fa" stroke-width="0.5" opacity="0.8"/>
    <text x="15" y="20" fill="#e8f1ff" font-size="10" font-weight="700" letter-spacing="2">REALM CONNECTIONS</text>
    
    <text x="15" y="38" fill="#9fb0cc" font-size="8">• Human ↔ Angel: Sunward Road + Realm Gate (safe, patrolled)</text>
    <text x="15" y="52" fill="#9fb0cc" font-size="8">• Human ↔ Demon: Thorn Road + Realm Gate (dangerous, requires guards)</text>
    <text x="15" y="66" fill="#9fb0cc" font-size="8">• Hidden Realm: Wandering portal only (moves every leap year)</text>
    <text x="15" y="80" fill="#9fb0cc" font-size="8">• Angel ↔ Demon: No direct gate — must cross through Human Realm</text>
    <text x="15" y="94" fill="#9fb0cc" font-size="8">• Academy: Neutral territory between all three realms</text>
  </g>

  <!-- ===== REALM INFO BOXES ===== -->
  <g transform="translate(860, 750)">
    <rect x="0" y="0" width="310" height="110" rx="8" fill="rgba(10,16,32,0.9)" stroke="#60a5fa" stroke-width="0.5" opacity="0.8"/>
    <text x="15" y="20" fill="#e8f1ff" font-size="10" font-weight="700" letter-spacing="2">POPULATION &amp; POWER</text>
    
    <text x="15" y="38" fill="#22d3ee" font-size="8">Human Realm: Largest population, weakest magic</text>
    <text x="15" y="52" fill="#fbbf24" font-size="8">Angel Realm: Smallest population, strongest individuals</text>
    <text x="15" y="66" fill="#8b5cf6" font-size="8">Demon Realm: Large population, endless armies</text>
    <text x="15" y="80" fill="#a78bfa" font-size="8">Hidden Realm: Tiny population, time-slowed</text>
    <text x="15" y="94" fill="#64748f" font-size="8">All races send children to Academy at age 15</text>
  </g>

</svg>
