<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <base href="/Half-made-world-Reference/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive worldbuilding archive for the Half-Made World" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Half-Made World — Worldbuilding Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: { 950: '#080a10', 900: '#0c0f16', 850: '#101420', 800: '#161a28', 700: '#1e2330' },
              parchment: '#ebe6d8',
              brass: '#c8a876',
              brassDeep: '#8f6b3c',
              mist: '#7f8fa3',
              ember: '#c25e4a',
              sage: '#6b8e6b',
            },
            fontFamily: {
              display: ['"Cinzel Decorative"', 'serif'],
              body: ['"Instrument Serif"', 'Georgia', 'serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            animation: {
              grain: 'grain 0.25s steps(8) infinite',
              float: 'float 8s ease-in-out infinite',
              'pulse-ring': 'pulse-ring 3s ease-in-out infinite',
            },
            keyframes: {
              grain: {
                '0%, 100%': { transform: 'translate(0,0)' },
                '10%': { transform: 'translate(-2%, -2%)' },
                '20%': { transform: 'translate(2%, 2%)' },
                '30%': { transform: 'translate(-1%, 1%)' },
                '40%': { transform: 'translate(1%, -1%)' },
                '50%': { transform: 'translate(-2%, 2%)' },
                '60%': { transform: 'translate(2%, -2%)' },
                '70%': { transform: 'translate(-1%, -2%)' },
                '80%': { transform: 'translate(1%, 2%)' },
                '90%': { transform: 'translate(-2%, 1%)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-6px)' },
              },
              'pulse-ring': {
                '0%': { boxShadow: '0 0 0 0 rgba(200,168,118,0.4)' },
                '50%': { boxShadow: '0 0 0 20px rgba(200,168,118,0)' },
                '100%': { boxShadow: '0 0 0 0 rgba(200,168,118,0)' },
              },
            },
          },
        },
      }
    </script>
  </head>
  <body class="font-body antialiased min-h-screen relative">
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:rgba(235,230,216,0.6);font-family:Georgia,serif;font-size:18px;">
        <span style="display:inline-block;width:12px;height:12px;border:2px solid rgba(200,168,118,0.4);border-top-color:#c8a876;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:12px;vertical-align:middle;"></span>
        Loading the archive…
      </div>
    </div>
    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#c25e4a;font-family:Georgia,serif;font-size:18px;text-align:center;padding:40px;">
        JavaScript is required to view the archive. Please enable JavaScript and reload the page.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
